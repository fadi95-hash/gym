<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#161b18">
<title>دفتر التمرين</title>
<style>
*{box-sizing:border-box}
:root{font-family:Tahoma,Arial,sans-serif;color:#222b24;background:#f1f3ec;line-height:1.6}
body{margin:0}
header{background:#161b18;color:#fff}
.hero,main{max-width:1080px;margin:auto;padding-inline:24px}
.hero{padding-block:48px 55px}
.brand{color:#c8f280;font-size:.95rem;font-weight:bold}
h1{font-size:clamp(2.6rem,8vw,5rem);line-height:1.15;margin:12px 0;letter-spacing:-.045em}
.hero p{color:#c5cec5;margin:0}
main{padding-block:28px 48px}
.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
section{border:1px solid #dce2d7;border-radius:22px;background:#fff;padding:24px;min-width:0}
h2{font-size:1.4rem;margin:0 0 16px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.full{grid-column:1/-1}
.sets{margin:16px 0 0;padding:12px;border:1px solid #d6dfd3;border-radius:12px}
.sets legend{font-weight:bold;padding-inline:6px}
.set-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:8px;align-items:end;margin-bottom:10px}
.set-row strong{grid-column:1/-1;font-size:.9rem}
.sequence{margin:0;padding-inline-start:1.4em}
.sequence li{padding-block:2px}
.machine-preview,.machine-photo{display:block;max-width:100%;object-fit:contain;border-radius:8px}
.machine-preview{max-height:150px;margin-top:8px}
.machine-photo{width:100px;max-height:82px;margin-top:6px}
[hidden]{display:none!important}
@media print{
  @page{margin:12mm;size:A4 landscape}
  :root,header{background:#fff;color:#000}
  .hero,main{padding:0}
  .hero{margin-bottom:16px}
  .hero h1{font-size:24pt;margin:0 0 8px}
  .hero p,.brand,.grid,#print-log,th:last-child,td:last-child{display:none!important}
  .history{border:0;margin:0;padding:0}
  .scroll{overflow:visible}
  table{white-space:normal}
  td,th{padding:5px;overflow-wrap:anywhere}
  tr{break-inside:avoid}
  thead{display:table-header-group}
}
label{display:grid;gap:5px;font-weight:bold;font-size:.9rem}
input,button{font:inherit;border-radius:10px;min-height:44px}
input{width:100%;padding:8px 11px;background:#f6f8f3;border:1px solid #d6dfd3;color:inherit}
button{cursor:pointer;font-weight:bold;border:1px solid transparent;padding:8px 15px;background:#c8f280;color:#182018}
button.secondary{background:transparent;border-color:#c7d3c9;color:inherit}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid #518857;outline-offset:3px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.timer{background:#21382a;color:#fff;border-color:#21382a}
.timer input{max-width:120px}
.clock{font:700 clamp(3.1rem,8vw,4.9rem)/1.1 monospace;margin:12px 0 18px;color:#e7ffc7;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
#timer-status{margin:10px 0 0;min-height:1.6em;color:#e7ffc7;font-size:.9rem}
.history{margin-top:18px}
.lookup{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:8px}
.lookup h2{margin:0}
.muted{color:#526356}
.scroll{overflow:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:start}
th,td{text-align:start;padding:10px;border-bottom:1px solid #e1e8de}
th{color:#526356;font-size:.9rem}
td button{min-height:36px;padding:4px 9px;margin-inline-end:5px}
#message:empty{display:none}
#message{margin-bottom:0}
@media(max-width:670px){.grid{grid-template-columns:1fr}.hero,main{padding-inline:16px}section{padding:17px}.hero{padding-block:36px}}
</style>
</head>
<body>
<header><div class="hero"><div class="brand">سجل اللياقة</div><h1>دفتر التمرين</h1><p>سجّل الوزن والتكرارات لكل مجموعة واضبط وقت الراحة بينها.</p></div></header>
<main>
<div class="grid">
<section aria-labelledby="form-title">
<h2 id="form-title">تسجيل تمرين</h2>
<form id="workout-form">
<div class="fields">
<label class="full">اسم التمرين<input name="exercise" required maxlength="80" placeholder="مثال: ضغط الصدر"></label>
<label>الراحة بين المجموعات (ثانية)<input name="rest" type="number" required min="1" max="3600" value="90"></label>
<label class="full">تاريخ التمرين<input name="date" type="date" required></label>
</div>
<div class="actions">
<label>صورة الجهاز (اختيارية)<input id="machine-file" type="file" accept="image/*"></label>
<div class="full">
<img id="machine-preview" class="machine-preview" alt="معاينة صورة الجهاز" hidden>
<button type="button" class="secondary" id="remove-photo" hidden>إزالة الصورة</button>
<p id="photo-message" role="status" hidden></p>
</div>
</div>
<fieldset class="sets"><legend>تسلسل المجموعات</legend>
<div id="set-rows"></div>
<button type="button" class="secondary" id="add-set">إضافة مجموعة</button>
</fieldset>
<div class="actions"><button id="save">حفظ التمرين</button><button class="secondary" type="button" id="cancel" hidden>إلغاء التعديل</button></div>
</form>
<p id="message" role="status"></p>
</section>
<section class="timer" aria-labelledby="timer-title">
<h2 id="timer-title">مؤقت الراحة</h2>
<div class="clock" id="clock" role="timer">01:30</div>
<form id="timer-form">
<label>المدة (ثانية)<input id="duration" type="number" required min="1" max="3600" value="90"></label>
<div class="actions"><button id="start">ابدأ</button><button id="pause" class="secondary" type="button" disabled>إيقاف مؤقت</button><button id="reset" class="secondary" type="button">إعادة ضبط</button></div>
</form>
<p id="timer-status" role="status"></p>
</section>
</div>
<section class="history" aria-labelledby="history-title">
<div class="lookup"><h2 id="history-title">سجل التمارين</h2><span class="muted" id="count"></span><button type="button" id="print-log">حفظ السجل بصيغة PDF</button></div>
<p id="empty" class="muted">ستظهر تمارينك المسجلة هنا.</p>
<div class="scroll" id="history-table" hidden tabindex="0" aria-label="جدول التمارين">
<table><thead><tr><th>التاريخ</th><th>التمرين</th><th>عدد المجموعات</th><th>تسلسل الأوزان والتكرارات</th><th>الراحة</th><th>الإجراءات</th></tr></thead><tbody id="rows"></tbody></table>
</div>
</section>
</main>
<script>
const get = id => document.getElementById(id);
const form = get('workout-form');
const fields = form.elements;
const storageKey = 'workout-notebook-v1';
const number = new Intl.NumberFormat('ar', { maximumFractionDigits: 10 });
const dateFormat = new Intl.DateTimeFormat('ar', { dateStyle: 'medium' });
let records = [];
let editing = null;
let storageReadable = true;

try {
  const stored = JSON.parse(localStorage.getItem(storageKey) ?? '[]');
  if (!Array.isArray(stored)) throw new Error('Invalid records');
  records = stored;
} catch {
  storageReadable = false;
  get('message').textContent = 'تعذر قراءة السجل من هذا المتصفح.';
}

function setToday() {
  const now = new Date();
  const parts = [now.getFullYear(), now.getMonth() + 1, now.getDate()];
  fields.date.value = parts.map(part => String(part).padStart(2, '0')).join('-');
}

function saveRecords(next) {
  try {
    if (!storageReadable) throw new Error('Cannot read existing records');
    localStorage.setItem(storageKey, JSON.stringify(next));
  } catch {
    get('message').textContent = 'تعذر حفظ التغيير في المتصفح. إذا امتلأت مساحة التخزين، جرّب حفظ التمرين بعد إزالة الصورة.';
    return false;
  }
  records = next;
  render();
  return true;
}

const setRows = get('set-rows');
const addSet = get('add-set');
const maxSets = 999;

function getSets(record) {
  if (Array.isArray(record.groups)) return record.groups;
  return Array.from({ length: record.sets }, () => ({
    weight: record.weight, reps: record.reps
  }));
}

function numberSets() {
  const count = setRows.childElementCount;
  addSet.disabled = count >= maxSets;
  Array.from(setRows.children).forEach((row, index) => {
    const label = 'المجموعة ' + number.format(index + 1);
    row.querySelector('strong').textContent = label;
    const removeButton = row.querySelector('button');
    removeButton.disabled = count === 1;
    removeButton.setAttribute('aria-label', 'حذف ' + label);
  });
}

function appendSet(group = { weight: '', reps: 10 }) {
  const row = document.createElement('div');
  row.className = 'set-row';
  row.innerHTML = `<strong></strong>
    <label>الوزن (كغ)<input name="group-weight" type="number" required min="0" step="any" inputmode="decimal" placeholder="0"></label>
    <label>التكرارات<input name="group-reps" type="number" required min="1" max="999"></label>
    <button type="button" class="secondary">حذف</button>`;
  const weight = row.querySelector('[name="group-weight"]');
  weight.value = group.weight;
  row.querySelector('[name="group-reps"]').value = group.reps;
  row.querySelector('button').addEventListener('click', () => {
    const next = row.nextElementSibling ?? row.previousElementSibling;
    row.remove();
    numberSets();
    next?.querySelector('input').focus();
  });
  setRows.append(row);
  return weight;
}

function showSets(groups) {
  setRows.replaceChildren();
  groups.forEach(appendSet);
  numberSets();
}

addSet.addEventListener('click', () => {
  const previous = setRows.lastElementChild;
  const weight = appendSet({
    weight: previous.querySelector('[name="group-weight"]').value,
    reps: previous.querySelector('[name="group-reps"]').value
  });
  numberSets();
  weight.focus();
});

const photoFile = get('machine-file');
const photoPreview = get('machine-preview');
const removePhoto = get('remove-photo');
const photoMessage = get('photo-message');
let photo = null;
let photoRequest = 0;
let photoLoading = false;

function showPhoto(value) {
  photo = value;
  photoPreview.hidden = !photo;
  removePhoto.hidden = !photo;
  if (photo) photoPreview.src = photo;
  else photoPreview.removeAttribute('src');
}

function setPhotoStatus(message, loading = false) {
  photoLoading = loading;
  get('save').disabled = loading;
  photoMessage.textContent = message;
  photoMessage.hidden = !message;
}

function resetPhoto(value = null) {
  photoRequest++;
  photoFile.value = '';
  setPhotoStatus('');
  showPhoto(value);
}

async function shrinkPhoto(file) {
  const url = URL.createObjectURL(file);
  try {
    const image = new Image();
    image.src = url;
    await image.decode();
    const scale = Math.min(1, 640 / Math.max(image.naturalWidth, image.naturalHeight));
    const canvas = document.createElement('canvas');
    canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
    canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
    const context = canvas.getContext('2d');
    context.fillStyle = 'white';
    context.fillRect(0, 0, canvas.width, canvas.height);
    context.drawImage(image, 0, 0, canvas.width, canvas.height);
    return canvas.toDataURL('image/jpeg', 0.75);
  } finally {
    URL.revokeObjectURL(url);
  }
}

photoFile.addEventListener('change', async () => {
  const file = photoFile.files[0];
  if (!file) return;
  const request = ++photoRequest;
  setPhotoStatus('جارٍ تجهيز الصورة…', true);
  try {
    const value = await shrinkPhoto(file);
    if (request !== photoRequest) return;
    showPhoto(value);
    setPhotoStatus('');
  } catch {
    if (request !== photoRequest) return;
    photoFile.value = '';
    setPhotoStatus('تعذر قراءة الصورة. اختر صورة بصيغة JPEG أو PNG.');
  }
});
removePhoto.addEventListener('click', () => {
  resetPhoto();
  photoFile.focus();
});
get('print-log').addEventListener('click', () => window.print());

function stopEditing() {
  editing = null;
  form.reset();
  resetPhoto();
  showSets([{ weight: "", reps: 10 }]);
  fields.exercise.setCustomValidity('');
  setToday();
  get('form-title').textContent = 'تسجيل تمرين';
  get('save').textContent = 'حفظ التمرين';
  get('cancel').hidden = true;
}

function edit(record) {
  editing = record.id;
  for (const key of ['exercise', 'rest', 'date']) {
    fields[key].value = record[key];
  }
  fields.exercise.setCustomValidity('');
  get('message').textContent = '';
  showSets(getSets(record));
  resetPhoto(record.photo);
  get('form-title').textContent = 'تعديل تمرين';
  get('save').textContent = 'حفظ التعديلات';
  get('cancel').hidden = false;
  fields.exercise.focus();
}

function remove(record) {
  if (!confirm('هل تريد حذف تمرين «' + record.exercise + '» من السجل؟')) return;
  if (saveRecords(records.filter(item => item.id !== record.id))) {
    if (editing === record.id) stopEditing();
    get('message').textContent = 'حُذف التمرين.';
  }
}

function render() {
  get('empty').hidden = records.length > 0;
  get('history-table').hidden = records.length === 0;
  get('count').textContent = records.length ? number.format(records.length) + ' في السجل' : '';
  const sorted = [...records].sort((a, b) => b.date.localeCompare(a.date));
  get('rows').replaceChildren(...sorted.map(record => {
    const row = document.createElement('tr');
    const groups = getSets(record);
    const values = [
      dateFormat.format(new Date(record.date + 'T12:00:00')), record.exercise,
      number.format(groups.length)
    ];
    for (const value of values) row.insertCell().textContent = value;
    if (record.photo) {
      const image = document.createElement('img');
      image.className = 'machine-photo';
      image.alt = 'صورة جهاز ' + record.exercise;
      image.src = record.photo;
      row.cells[1].append(image);
    }
    const sequence = document.createElement('ol');
    sequence.className = 'sequence';
    for (const group of groups) {
      const item = document.createElement('li');
      item.textContent = number.format(group.weight) + ' كغ × ' + number.format(group.reps);
      sequence.append(item);
    }
    row.insertCell().append(sequence);
    row.insertCell().textContent = number.format(record.rest) + ' ث';
    const actions = row.insertCell();
    for (const [label, action] of [['تعديل', edit], ['حذف', remove]]) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'secondary';
      button.textContent = label;
      button.setAttribute('aria-label', label + ' ' + record.exercise);
      button.addEventListener('click', () => action(record));
      actions.append(button);
    }
    return row;
  }));
}

form.addEventListener('submit', event => {
  event.preventDefault();
  if (photoLoading) return;
  const exercise = fields.exercise.value.trim();
  if (!exercise) {
    fields.exercise.setCustomValidity('اكتب اسم التمرين.');
    fields.exercise.reportValidity();
    return;
  }
  const record = {
    id: editing ?? (globalThis.crypto?.randomUUID?.() ?? Date.now() + '-' + Math.random()),
    exercise,
    photo,
    date: fields.date.value,
    groups: Array.from(setRows.children, row => ({
      weight: row.querySelector('[name="group-weight"]').valueAsNumber,
      reps: row.querySelector('[name="group-reps"]').valueAsNumber
    })),
    rest: fields.rest.valueAsNumber
  };
  const next = editing ? records.map(item => item.id === editing ? record : item) : [record, ...records];
  if (!saveRecords(next)) return;
  if (!deadline && paused === null) {
    get('duration').value = record.rest;
    resetTimer();
  }
  get('message').textContent = editing ? 'حُفظت التعديلات.' : 'حُفظ التمرين.';
  stopEditing();
});
fields.exercise.addEventListener('input', () => fields.exercise.setCustomValidity(''));
get('cancel').addEventListener('click', stopEditing);

let deadline = 0;
let paused = null;
let interval;
function displayTime(ms) {
  const seconds = Math.ceil(ms / 1000);
  get('clock').textContent = [Math.floor(seconds / 60), seconds % 60]
    .map(value => String(value).padStart(2, '0')).join(':');
}
function stopClock() {
  clearInterval(interval);
  deadline = 0;
  get('start').disabled = false;
  get('pause').disabled = true;
  get('duration').readOnly = false;
}
function resetTimer() {
  stopClock();
  paused = null;
  get('start').textContent = 'ابدأ';
  get('timer-status').textContent = '';
  displayTime((get('duration').validity.valid ? get('duration').valueAsNumber : 0) * 1000);
}
function tick() {
  if (!deadline) return;
  const remaining = Math.max(0, deadline - Date.now());
  displayTime(remaining);
  if (!remaining) {
    stopClock();
    get('start').textContent = 'ابدأ';
    get('timer-status').textContent = 'انتهت فترة الراحة.';
  }
}
get('timer-form').addEventListener('submit', event => {
  event.preventDefault();
  if (deadline) return;
  deadline = Date.now() + (paused ?? get('duration').valueAsNumber * 1000);
  paused = null;
  get('start').disabled = true;
  get('pause').disabled = false;
  get('duration').readOnly = true;
  get('timer-status').textContent = '';
  tick();
  if (deadline) interval = setInterval(tick, 200);
});
get('pause').addEventListener('click', () => {
  tick();
  if (!deadline) return;
  paused = Math.max(1, deadline - Date.now());
  stopClock();
  get('start').textContent = 'استئناف';
  get('timer-status').textContent = 'المؤقت متوقف مؤقتًا.';
});
get('reset').addEventListener('click', resetTimer);
get('duration').addEventListener('input', resetTimer);
document.addEventListener('visibilitychange', tick);
stopEditing();
render();
</script>
</body>
</html>
